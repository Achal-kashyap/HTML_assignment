  .box:hover {
    transform: rotateX(-150deg) rotateY(-45deg) translateZ(50px);
    transition: transform 0.9s ease-in-out;                     /* transition-duration */
    transition-duration: 1s;            
    transition-delay: 0.2s;
    background-color: rgb(252, 77, 77);
    animation: animate 2s linear infinite;
  }
  @keyframes animate {
    0% {
      border-radius: 0%;
      transform: rotateX(0deg) rotateY(0deg) translateZ(50px);
    }
    100% {
      width: 0px;
      height: 0px;
      border-radius: 100%;
      background-color: rgb(215, 30, 110);
      transform: rotateX(360deg) rotateY(360deg) translateZ(50px);
    }
  }

.pyramid {
  position: relative;
  width: 180px;
  height: 180px;
  transform-style: preserve-3d;
  animation: rotate 5s linear infinite;
}

.face {
  position: absolute;
  width: 0;
  height: 0;
  left: 0;
  top: 0;
  border-left: 90px solid transparent;
  border-right: 90px solid transparent;
  border-bottom: 160px solid #6b5cff;
  transform-origin: 50% 0%;
  filter: drop-shadow(0 0 12px #795bff);
}

.front {
  transform: translateZ(15px) rotateX(30deg);
  border-bottom-color: #55e6ff;
}

.back {
  transform: rotateY(180deg) translateZ(15px) rotateX(25deg);
  border-bottom-color: #8b5cf6;
}

.left {
  transform: rotateY(-90deg) translateZ(10px) rotateX(25deg);
  border-bottom-color: #3434b8;
}

.right {
  transform: rotateY(90deg) translateZ(10px) rotateX(25deg);
  border-bottom-color: #b04dff;
}

@keyframes rotate {
  from {
    transform: rotateX(-20deg) rotateY(0deg);
  }
  to {
    transform: rotateX(-20deg) rotateY(360deg);
  }
}
