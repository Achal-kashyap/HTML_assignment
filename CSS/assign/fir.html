<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

.navbar {
    height: 70px;
    background-color: #0c0a53;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 50px;
}

.logo {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 30px;
    list-style: none;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-size: 16px;
}

.nav-links a:hover {
    color: #6070d9;
}

.dropdown {
    position: relative;
}

.dropdown-menu {
    display: none;
    position: absolute;
    top: 25px;
    left: 0;
    background-color: white;
    width: 150px;
    padding: 10px 0;
    box-shadow: 10px 4px 10px rgba(4, 0, 0, 0.3);
}

.dropdown-menu a {
    display: block;
    color: black;
    padding: 10px 15px;
}

.dropdown-menu a:hover {
    background-color: #eee;
}

.dropdown:hover .dropdown-menu {
    display: block;
}
.login-btn {
    background-color: #6070d9;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2);
}
.hamburger {
    font-size: 24px;
    color: white;
    cursor: pointer;
    padding-left: 10px;
}
@media screen and (max-width: 768px) {
    .nav-links {
        display: none;
    }
    .login-btn {
        display: none;
    }
    .hamburger {
        display: block;
    }
}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            MyWebsite
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li class="dropdown"><a href="#">Products ▾</a>
                 <div class="dropdown-menu">
                    <a href="#">Laptop</a>
                    <a href="#">Mobile</a>
                    <a href="#">Accessories</a>
                </div>
            </li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div>
        <button class="login-btn">Login</button>
        <button class="login-btn">Sign Up</button>
        <span class="hamburger">&#9776;</span>
        </div>
    </nav>
</body>
</html>
