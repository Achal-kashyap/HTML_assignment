





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventhive Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            width: 100%;
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 35px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .logo {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo h2 {
            font-family: Georgia, serif;
            font-size: 22px;
            color: #333;
        }

        .logo span {
            font-size: 8px;
            font-weight: bold;
            color: #d9ad45;
            margin-top: 3px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-link {
            height: 34px;
            padding: 0 15px;
            border-radius: 20px;
            border: 1px solid #eeeeee;
            background: white;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: #555;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
        }

        .nav-link.active {
            background: #050505;
            color: white;
            border: none;
        }

        .nav-link i {
            font-size: 10px;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid #eeeeee;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
        }

        .icon-btn i {
            font-size: 14px;
            color: #333;
        }

        .profile {
            height: 38px;
            padding: 3px 12px 3px 5px;
            border-radius: 25px;
            background: white;
            border: 1px solid #eeeeee;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .profile-img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
        }

        .profile-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .profile-text strong {
            font-size: 8px;
            color: #444;
        }

        .profile-text span {
            font-size: 7px;
            color: #48a868;
        }

        .profile i {
            font-size: 8px;
            color: #777;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <h2>eventhive.in</h2>
            <span>SWAMINARAYAN UNIVERSITY</span>
        </div>

        <div class="nav-links">
            <div class="nav-link active">
                <i class="fa-solid fa-house"></i>
                Home
            </div>

            <div class="nav-link">
                <i class="fa-regular fa-compass"></i>
                Explore
            </div>

            <div class="nav-link">
                <i class="fa-regular fa-calendar"></i>
                Thanganat 5.0
            </div>

            <div class="nav-link">
                <i class="fa-solid fa-ticket"></i>
                My Passes
                <span>🟡</span>
            </div>

            <div class="nav-link">
                <i class="fa-regular fa-bookmark"></i>
                Wishlist
                <span>🩷</span>
            </div>
        </div>

        <div class="right-section">
            <div class="icon-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="icon-btn">
                <i class="fa-regular fa-moon"></i>
            </div>

            <div class="icon-btn">
                <i class="fa-regular fa-bell"></i>
            </div>

            <div class="profile">
                <div class="profile-img"></div>
                <div class="profile-text">
                    <strong>Shivam Tripathi</strong>
                    <span>Student</span>
                </div>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
        </div>
    </nav>

</body>
</html>
