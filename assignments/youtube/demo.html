
<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 200px;
    height: 200px;
    position: relative;
}

.triangle1 {
    width: 100%;
    height: 100%;
    position: absolute;
    background: green;
    clip-path: polygon(0% 0%, 100% 0%, 50% 50%); 
}

.triangle2 {
    width: 100%;
    height: 100%;
    position: absolute;
    background: yellow;
    clip-path: polygon(100% 0%, 100% 100%, 50% 50%);
}

.triangle3 {
    width: 100%;
    height: 100%;
    position: absolute;
    background: blue;
    clip-path: polygon(0% 100%, 100% 100%, 50% 50%);
}

.triangle4{
    width: 100%;
    height: 100%;
    position: absolute;
    background: rgb(254, 3, 3);
    clip-path: polygon(0% 0%, 0% 100%, 50% 50%);
}
</style>
</head>
<body>

<div class="box">
    <div class="triangle1"></div>
    <div class="triangle2"></div>
    <div class="triangle3"></div>
    <div class="triangle4"></div>
</div>

</body>
</html>
